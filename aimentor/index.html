<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .chat-container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }
    .chat-footer {
      display: flex;
      padding: 15px;
      background: #f9f9f9;
    }
    .chat-footer textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .chat-footer button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .chat-footer button:hover {
      background: #0056b3;
    }
    .iframe-container {
      text-align: center;
      margin-top: 20px;
    }
    .iframe-container iframe {
      width: 100%;
      max-width: 600px;
      height: 400px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Chatbot
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- Messages will appear here -->
    </div>
    <div class="chat-footer">
      <textarea id="userInput" rows="1" placeholder="Type your message here..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</body>
</html>
