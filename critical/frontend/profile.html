<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Critical Thinking Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/2641/2641457.png" alt="Logo" class="logo-img">
            <span>GamePortal</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="leaderboard.html"><i class="fas fa-trophy"></i> Leaderboard</a></li>
                <li class="nav-right">
                    <a href="profile.html" id="profileBtn" class="nav-btn active"><i class="fas fa-user"></i> Profile</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="profile-container">
        <div class="profile-sidebar">
            <div class="profile-header">
                <div class="profile-avatar">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile Avatar" id="profileAvatar">
                    <button class="edit-avatar">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                <h2 id="userName">Loading...</h2>
                <p id="userEmail">loading@example.com</p>
            </div>
            <div class="profile-menu">
                <button class="menu-item active" data-tab="overview">
                    <i class="fas fa-th-large"></i>
                    Overview
                </button>
                <button class="menu-item" data-tab="statistics">
                    <i class="fas fa-chart-bar"></i>
                    Statistics
                </button>
                <button class="menu-item" data-tab="achievements">
                    <i class="fas fa-trophy"></i>
                    Achievements
                </button>
                <button class="menu-item" data-tab="settings">
                    <i class="fas fa-cog"></i>
                    Settings
                </button>
                <button class="menu-item logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </div>

        <div class="profile-content">
            <!-- Overview Tab -->
            <div class="tab-content active" id="overview">
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-brain"></i>
                        <div class="stat-info">
                            <h3>Quiz Score</h3>
                            <p id="quizScore">850</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-trophy"></i>
                        <div class="stat-info">
                            <h3>Rank</h3>
                            <p id="userRank">#42</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-check-circle"></i>
                        <div class="stat-info">
                            <h3>Completed</h3>
                            <p id="completedQuizzes">24</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-star"></i>
                        <div class="stat-info">
                            <h3>Achievements</h3>
                            <p id="achievementCount">12</p>
                        </div>
                    </div>
                </div>

                <div class="recent-activity">
                    <h3>Recent Activity</h3>
                    <div class="activity-list" id="activityList">
                        <!-- Activity items will be added dynamically -->
                    </div>
                </div>

                <div class="performance-chart">
                    <h3>Performance Trend</h3>
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>

            <!-- Statistics Tab -->
            <div class="tab-content" id="statistics">
                <div class="stats-charts">
                    <div class="chart-container">
                        <h3>Quiz Categories Performance</h3>
                        <canvas id="categoryChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3>Weekly Progress</h3>
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Achievements Tab -->
            <div class="tab-content" id="achievements">
                <div class="achievements-grid">
                    <!-- Achievement items will be added dynamically -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="settings">
                <div class="settings-form">
                    <h3>Profile Settings</h3>
                    <form id="profileSettingsForm">
                        <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" id="displayName" placeholder="Enter your display name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="settingsEmail" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label>Bio</label>
                            <textarea id="userBio" placeholder="Tell us about yourself"></textarea>
                        </div>
                        <button type="submit" class="save-btn">Save Changes</button>
                    </form>

                    <h3>Preferences</h3>
                    <div class="preferences">
                        <div class="preference-item">
                            <span>Email Notifications</span>
                            <label class="switch">
                                <input type="checkbox" id="emailNotifications">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="preference-item">
                            <span>Dark Mode</span>
                            <label class="switch">
                                <input type="checkbox" id="darkMode">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
